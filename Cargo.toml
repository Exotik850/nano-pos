[package]
name = "nano-pos"
version = "0.1.0"
authors = ["Exotik850 <kidkool850@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4", default-features = false }
cookie = { version = "0.18", optional = true, features = ["signed"] }
diesel = { version = "2.3", optional = true, default-features = false, features = [
  "postgres",
  "chrono",
] }
dioxus = { version = "0.7", features = ["fullstack", "router", "html"] }
dotenvy = "0.15"
serde = { version = "1", default-features = false }
argon2 = { version = "0.6", optional = true }
sha2 = { version = "0.11", optional = true, default-features = false }
serde_json = { version = "1", optional = true, default-features = false }
dioxus-html = { version = "0.7.10", features = ["serialize"] }

[features]
default = ["web"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
# The feature that are only required for the server = ["dioxus/server"] build target should be optional and only enabled in the server = ["dioxus/server"] feature
server = [
  "dioxus/server",
  "dep:cookie",
  "dep:diesel",
  "dep:argon2",
  "dep:sha2",
  "dep:serde_json",
]
